name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Files that must exist with the right names
        run: |
          test -f phagetailor           || { echo "::error::phagetailor missing (is it still phagetailor.txt?)"; exit 1; }
          test -x phagetailor           || { echo "::error::phagetailor is not executable"; exit 1; }
          test -f workflow/Snakefile    || { echo "::error::workflow/Snakefile missing (is it still Snakefile.txt?)"; exit 1; }
          for e in annotation gtdbtk macsyfinder phage python; do
            test -f "workflow/envs/$e.yaml" || { echo "::error::workflow/envs/$e.yaml missing"; exit 1; }
          done

      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done

      - name: CLI imports and responds
        run: |
          python3 -c "import ast; ast.parse(open('phagetailor').read())"
          ./phagetailor --help > /dev/null

      - name: Every URL in the README and setup scripts resolves
        run: |
          fail=0
          # Fetch only the first byte: these targets include multi-GB tarballs,
          # and a full GET would time out rather than test reachability.
          # Skip bare base/prefix URLs, which are string-built and never resolve alone.
          grep -rhoE 'https://[a-zA-Z0-9./_-]+' README.md scripts/*.sh \
            | sed 's/[.,)]*$//' | sort -u \
          | while IFS= read -r u; do
              case "$u" in
                */records/*/files) echo "skip ---  $u  (base prefix)"; continue ;;
              esac
              code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 -r 0-0 "$u" || echo 000)
              case "$code" in
                2*|3*) echo "ok   $code  $u" ;;
                *)     echo "DEAD $code  $u"; echo "$u" >> /tmp/dead ;;
              esac
            done
          if [ -s /tmp/dead ]; then echo "::error::dead URLs found"; cat /tmp/dead; exit 1; fi

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge,bioconda
          channel-priority: strict

      - name: Launcher env is snakemake only
        shell: bash -el {0}
        run: conda install -y -c conda-forge -c bioconda snakemake-minimal

      - name: Snakemake parses the workflow
        shell: bash -el {0}
        run: |
          # Minimal fixture: parsing only needs a readable genome list, not real
          # sequence. Kept out of the repo so no fake genome ships to users.
          mkdir -p /tmp/fx /tmp/fx/genomad_db /tmp/fx/gtdbtk_db
          printf '>contig_1\nATGAAACGCATTAGCACCACCATTACCACCACCATCACCATTACCACAGGT\n' > /tmp/fx/sample.fna
          echo /tmp/fx/sample.fna > /tmp/fx/genome_paths.txt
          # Stub DB dirs satisfy the fail-fast existence check; parsing never reads them.
          snakemake -s workflow/Snakefile --configfile config/config.yaml \
            --config genome_list=/tmp/fx/genome_paths.txt output_dir=/tmp/fx/out \
                     genomad_db=/tmp/fx/genomad_db gtdbtk_db=/tmp/fx/gtdbtk_db \
            --list

      - name: Unset database gives an actionable error, not a traceback
        shell: bash -el {0}
        run: |
          out=$(snakemake -s workflow/Snakefile --configfile config/config.yaml \
                  --config genome_list=/tmp/fx/genome_paths.txt output_dir=/tmp/fx/out \
                  --list 2>&1 || true)
          echo "$out" | head -5
          echo "$out" | grep -q "setup_genomad_db.sh" \
            || { echo "::error::expected the setup hint"; exit 1; }
          echo "ok: actionable error"

      - name: Missing genome list gives an actionable error, not a traceback
        shell: bash -el {0}
        run: |
          out=$(snakemake -s workflow/Snakefile --configfile config/config.yaml \
                  --config genome_list=/tmp/does_not_exist.txt --list 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "genome list not found" \
            || { echo "::error::expected a friendly WorkflowError"; exit 1; }
          echo "$out" | grep -q "Traceback" \
            && { echo "::error::leaked a Python traceback"; exit 1; }
          echo "ok: actionable error"

      - name: Per-rule conda envs solve
        shell: bash -el {0}
        run: |
          for e in workflow/envs/*.yaml; do
            echo "== $e"
            conda env create -n "probe-$(basename "$e" .yaml)" -f "$e" --dry-run
          done
