# Exact versions as used (conda env: mvip, python 3.8.19)
channels:
  - conda-forge   # must precede bioconda (bioconda's documented order)
  - bioconda
dependencies:
  - python=3.8.19
  - pyrodigal-gv=0.3.2
  - pyrodigal=3.6.3
  - mmseqs2=14.7e284
  - hmmer=3.4
  # pyrodigal-gv 0.3.2 imports importlib.resources.files, which exists only
  # from python 3.9. On this pinned 3.8 it falls back to the importlib_resources
  # backport, which its conda recipe does not declare -- so without this the
  # tool cannot even start:
  #   ModuleNotFoundError: No module named 'importlib_resources'
  - importlib_resources
