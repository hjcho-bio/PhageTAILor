# Data-science stack for feature assembly, classification and reporting.
#
# Library versions are the as-run ones from the paper. Only the interpreter
# moved: 3.8.19 -> 3.11.
#
# Why: Snakemake's `script:` directive re-imports Snakemake *inside this env* to
# rebuild the `snakemake` object. Snakemake >=9 uses PEP 604 unions
# ("None | str"), which Python 3.8 cannot parse, so every script: rule died with
#   TypeError: unsupported operand type(s) for |: 'NoneType' and 'type'
# That is 10 rules -- all the collate steps plus features, classify and report,
# i.e. the whole second half of the pipeline.
#
# These packages were also previously installed via pip (on the belief that
# pyarrow 17 had no python-3.8 conda-forge build). They come from conda-forge
# now: the pip path additionally broke Apple Silicon, where lightgbm 3.3.5 has
# no arm64 wheel and pip fell back to a source build that needs CMake.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.24.4
  - pandas=2.0.3
  - scikit-learn=1.3.2
  - lightgbm=3.3.5
  - pyarrow=17.0.0
  - jinja2=3.1.4
